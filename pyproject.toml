[project]
name = "sjs-phenotype"
version = "0.1.0"
description = "Phénotypage computationnel de la SjD sur données OMOP"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0"]

[project.scripts]
sjs-phenotype = "sjs_phenotype.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sjs_phenotype"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["sjs_phenotype", "aide_omop"]
